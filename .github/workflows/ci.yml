name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pagw
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: pagw
        ports: ["55479:5432"]
        options: --health-cmd "pg_isready -U pagw -d pagw" --health-interval 5s --health-timeout 3s --health-retries 20
      sqs:
        image: localstack/localstack:4.0.3
        env:
          SERVICES: sqs
          SQS_ENDPOINT_STRATEGY: path
          LOCALSTACK_HOST: 127.0.0.1:45679
        ports: ["45679:4566"]
    env:
      PAGW_DATABASE_URL: postgresql://pagw:local-only@127.0.0.1:55479/pagw
      PAGW_TEST_SQS_ENDPOINT: http://127.0.0.1:45679
      UV_CACHE_DIR: /tmp/pagw-uv
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.10.8
      - run: make setup
      - run: make verify
      - run: .venv/bin/python scripts/check_openapi.py
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .runtime/requirements-audit.txt
      - run: .venv/bin/pip-audit -r .runtime/requirements-audit.txt --disable-pip
      - run: docker build -t pagw:test .
      - run: .venv/bin/python scripts/dev.py up
      - run: make demo
      - if: always()
        run: .venv/bin/python scripts/dev.py down
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.5.7"
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
